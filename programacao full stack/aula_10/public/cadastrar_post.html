<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Post</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="caixa">
        <h1>Novo Post</h1>

        <form action="/cadastrar_post" method="post">
            <p>Título:</p>
            <input type="text" name="titulo">

            <p>Resumo:</p>
            <input type="text" name="resumo">

            <p>Conteúdo:</p>
            <textarea name="conteudo"></textarea>

            <br><br>

            <input type="submit" value="Cadastrar">
        </form>

        <br>

        <a href="/blog">Voltar para o blog</a>
    </div>

</body>
</html>
