<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="caixa">
        <h1>Cadastro</h1>

        <form action="/cadastrar" method="post">

        <br>

        <a href="/login">Ir para Login</a>
    </div>

</body>
</html>
